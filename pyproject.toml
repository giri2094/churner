[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "churner"
version = "0.1.0"
description = "A production-style machine learning application for customer churn prediction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giridharan Murugesan" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["churner*"]
namespaces = true
